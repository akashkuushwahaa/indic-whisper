[project]
name = "indic-whisper"
version = "0.1.0"
description = "Fine-tune Whisper for Indian languages (Gujarati, Hindi) on Shrutilipi, evaluated on Vistaar"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "pyarrow>=15",
    "soundfile>=0.12",
    "transformers>=4.44",
    "jiwer>=3.0",
    "indic-nlp-library>=0.92",
    "soxr>=1.1.0",
]

[project.optional-dependencies]
# Kaggle/Colab already ship torch; install this extra only on a local machine.
torch = ["torch>=2.3"]
# Training. bitsandbytes (8-bit AdamW) only installs/works with CUDA.
train = ["accelerate>=1.0", "tensorboard>=2.15", "bitsandbytes>=0.45; sys_platform != 'darwin'"]

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "pytest>=8",
]

[project.scripts]
iw-prepare = "iwhisper.prepare:main"
iw-inspect = "iwhisper.inspect_source:main"
iw-score = "iwhisper.score:main"
iw-fetch-indicwhisper = "iwhisper.indicwhisper:main"
iw-score-job = "iwhisper.job:main"
iw-bench-build = "iwhisper.bench:main_build"
iw-eval = "iwhisper.bench:main_eval"
iw-eval-report = "iwhisper.bench:main_report"
iw-eval-job = "iwhisper.bench:main_eval_job"
iw-train = "iwhisper.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iwhisper"]
[tool.pytest.ini_options]
pythonpath = ["tests"]
